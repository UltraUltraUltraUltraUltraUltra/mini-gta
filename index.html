:root{--pink:#ff3fa4;--cyan:#34f0ff;--yellow:#ffe14a;--violet:#8a5cff;--bg:rgba(18,10,48,.78);--line:rgba(140,110,255,.45)}
#ui{position:fixed;inset:0;pointer-events:none;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#f2eeff;user-select:none;-webkit-user-select:none}
#ui *{box-sizing:border-box}
.panel{background:var(--bg);border:2px solid var(--line);border-radius:14px;box-shadow:0 0 18px rgba(138,92,255,.35),inset 0 0 12px rgba(52,240,255,.08);backdrop-filter:blur(3px)}
#minimap{position:absolute;left:14px;top:14px;width:176px;height:176px;border-radius:50%;overflow:hidden;border:3px solid var(--cyan);box-shadow:0 0 16px rgba(52,240,255,.6);background:#150c36}
#minimap canvas{width:100%;height:100%;display:block}
#place{position:absolute;left:14px;top:198px;padding:5px 12px;font-size:13px;letter-spacing:.5px}
#place b{color:var(--yellow)}
#money{position:absolute;right:16px;top:12px;font-size:30px;font-weight:800;color:#6dff9a;text-shadow:0 0 12px rgba(109,255,154,.8);letter-spacing:1px}
#stars{position:absolute;right:16px;top:52px;font-size:28px;letter-spacing:3px}
#stars .on{color:var(--yellow);text-shadow:0 0 10px rgba(255,225,74,.9)}
#stars .off{color:rgba(255,255,255,.18)}
#stars.flash .on{animation:blink .45s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.25}}
#mission{position:absolute;right:16px;top:98px;width:270px;padding:10px 14px}
#mission .t{font-weight:800;color:var(--cyan);font-size:14px;text-transform:uppercase;letter-spacing:1px}
#mission .o{margin-top:3px;font-size:14px}
#mission .m{margin-top:5px;font-size:20px;font-weight:800;color:var(--yellow)}
#bars{position:absolute;left:16px;bottom:16px;width:260px}
.bar{height:12px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px;border:1px solid rgba(255,255,255,.2)}
.bar i{display:block;height:100%;border-radius:7px;transition:width .15s}
#hpbar i{background:linear-gradient(90deg,#ff3f6a,#ff9a5a)}
#carbar i{background:linear-gradient(90deg,#34f0ff,#8a5cff)}
#nitrobar i{background:linear-gradient(90deg,#ffe14a,#ff3fa4)}
#bars .lbl{font-size:11px;opacity:.75;letter-spacing:1px;margin-top:5px}
#speed{position:absolute;right:20px;bottom:18px;text-align:right;font-weight:800}
#speed b{font-size:54px;color:#fff;text-shadow:0 0 14px var(--pink)}
#speed span{font-size:16px;opacity:.8;margin-left:4px}
#radio{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:6px 16px;font-size:14px;white-space:nowrap}
#radio b{color:var(--pink)}
#hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);padding:8px 18px;font-size:16px;font-weight:700;opacity:0;transition:opacity .2s;white-space:nowrap}
#hint.show{opacity:1}
#toasts{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(80vw,560px)}
.toast{padding:8px 16px;font-size:16px;font-weight:700;text-align:center;animation:tin .25s ease-out;transition:opacity .4s}
.toast.good{border-color:#6dff9a;color:#b9ffd0}.toast.bad{border-color:#ff5a6a;color:#ffc0c8}.toast.warn{border-color:var(--yellow);color:#fff2a8}
@keyframes tin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
#arrow{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:none;text-align:center;font-size:11px;font-weight:800}
#arrow .tri{width:0;height:0;margin:0 auto;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:20px solid var(--yellow);filter:drop-shadow(0 0 6px var(--yellow))}
#arrow .d{margin-top:2px;text-shadow:0 0 4px #000}
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:72px;font-weight:900;letter-spacing:6px;opacity:0;transition:opacity .4s;text-shadow:0 0 24px currentColor}
#banner.show{opacity:1}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(60,30,120,.82),rgba(10,5,30,.94));pointer-events:auto;z-index:20}
.overlay.show{display:flex}
.card{width:min(92vw,560px);max-height:92vh;overflow:auto;padding:22px 26px}
.card h1{margin:0 0 4px;font-size:34px;letter-spacing:2px;color:var(--pink);text-shadow:0 0 18px var(--pink)}
.card h2{margin:0 0 12px;font-size:20px;color:var(--cyan)}
.card p,.card li{font-size:14px;line-height:1.5;opacity:.92}
.btn{display:block;width:100%;margin:8px 0;padding:11px 14px;font:700 17px "Trebuchet MS",Arial,sans-serif;color:#fff;background:linear-gradient(180deg,#5a3ac8,#3a2490);border:2px solid var(--cyan);border-radius:12px;cursor:pointer;box-shadow:0 0 12px rgba(52,240,255,.3)}
.btn:hover{filter:brightness(1.25)}.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.alt{background:linear-gradient(180deg,#c02b86,#7a1a5a);border-color:var(--pink)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row label{flex:1;font-size:14px}
.row select,.row input[type=range]{flex:1.2}
.row select{background:#241450;color:#fff;border:1px solid var(--cyan);border-radius:8px;padding:6px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin-top:6px}.keys b{color:var(--yellow)}
.up{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.up .n{font-weight:700}.up .s{font-size:12px;opacity:.7}
.up button{padding:6px 12px;font-weight:800;border-radius:9px;border:2px solid #6dff9a;background:#143a30;color:#bfffd5;cursor:pointer}
.up button:disabled{opacity:.4;border-color:#888;color:#aaa;cursor:default}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.sw{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.4);cursor:pointer}.sw.sel{border-color:#fff;box-shadow:0 0 10px #fff}
#fullmap{position:fixed;inset:0;display:none;background:rgba(10,5,30,.9);pointer-events:auto;z-index:15;align-items:center;justify-content:center}
#fullmap.show{display:flex}#fullmap canvas{max-width:92vmin;max-height:92vmin;border:3px solid var(--cyan);border-radius:10px;box-shadow:0 0 30px rgba(52,240,255,.5)}
#fullmap .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:14px;opacity:.85}
#snd{position:absolute;right:16px;bottom:96px;width:40px;height:40px;border-radius:50%;pointer-events:auto;cursor:pointer;text-align:center;line-height:36px;font-size:19px}
.touch-ui{position:fixed;inset:0;pointer-events:none;z-index:12}
.joy{position:absolute;left:24px;bottom:34px;width:140px;height:140px;border-radius:50%;background:rgba(138,92,255,.22);border:2px solid var(--cyan);pointer-events:auto;touch-action:none}
.joy-knob{position:absolute;left:41px;top:41px;width:58px;height:58px;border-radius:50%;background:rgba(52,240,255,.55);box-shadow:0 0 12px var(--cyan)}
.tbtns{position:absolute;right:12px;bottom:110px;display:grid;grid-template-columns:repeat(2,auto);gap:8px;pointer-events:auto}
.tb{min-width:74px;padding:10px 6px;font:700 13px Arial;color:#fff;background:rgba(58,36,144,.7);border:2px solid var(--pink);border-radius:12px;touch-action:none}
.tb.big{grid-column:span 2;font-size:17px}
